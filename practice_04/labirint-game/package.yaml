name:                labirint-game
version:             0.1.0.0
github:              "githubuser/labirint-game"
license:             BSD-3-Clause
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2026 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/labirint-game#readme>

dependencies:
- base >= 4.7 && < 5
- mtl
- transformers
- containers

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - MyStateT
    - MazeTypes
    - MazeLoader
    - GameMonad

executables:
  labirint-game-exe:
    main:                Main.hs
    source-dirs:         app
    dependencies:
    - labirint-game

tests:
  labirint-game-test:
    main:                Spec.hs
    source-dirs:         test
    dependencies:
    - labirint-game
